[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-image-tools"
version = "0.1.0"
description = "Local desktop visual search for images and design source files"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "psd-tools[composite]>=1.10,<2",
  "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
image-tools = "image_tools.__main__:main"

[tool.setuptools.packages.find]
include = ["image_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
