name: Windows installer

on:
  push:
    branches: [main, 'codex/windows-installer']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      archive_release:
        description: Archive existing verified packages instead of rebuilding
        type: boolean
        default: false
      release_tag:
        default: v0.2.1
      macos_run_id:
        default: '43166369089'
      windows_run_id:
        default: '43166369084'

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.archive_release
    name: Build and test Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          architecture: x64
      - name: Restore compiled Windows installers
        id: installer-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256
            build/previous-installer/*-setup.exe
            build/previous-installer/*-setup.exe.sha256
          # Lifecycle-test edits may reuse the same binaries, but every input to
          # either installer build must invalidate them. Hash source files only,
          # before Python has generated __pycache__ directories.
          key: windows-installers-v1-${{ runner.os }}-x64-python${{ steps.python.outputs.python-version }}-inno6.7.4-baseline-c940d732868c11cf15cf264d8cc9a28c5f2045ea-${{ hashFiles('image_tools/**', 'installer/**', 'scripts/desktop_entry.py', 'scripts/build_windows.ps1', 'scripts/windows/compile-installer.ps1', 'build-windows.bat', 'requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}
      - name: Install installer compiler and optional document renderer
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.4 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Inno Setup installation failed' }
          choco install ghostscript --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Ghostscript installation failed' }
      - name: Build candidate and run application regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/test-results -Force | Out-Null
          $buildError = $null
          Start-Transcript -Path build/test-results/windows-build.log | Out-Null
          try {
            python -m venv .venv
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the Python 3.12 environment' }
            if ('${{ steps.installer-cache.outputs.cache-hit }}' -eq 'true') {
              # A cache hit skips compilation only. Reinstall dependencies and
              # execute the complete current source suite on this Windows host.
              & .venv/Scripts/python.exe -m pip install -r requirements-dev.txt
              if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
              & .venv/Scripts/python.exe -m pip check
              if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed' }
              $previousPlatform = $env:QT_QPA_PLATFORM
              try {
                $env:QT_QPA_PLATFORM = 'offscreen'
                & .venv/Scripts/python.exe -m pytest -q -ra --junitxml=build/test-results/pytest.xml
                if ($LASTEXITCODE -ne 0) { throw 'Windows application regressions failed' }
              } finally {
                $env:QT_QPA_PLATFORM = $previousPlatform
              }
            } else {
              ./scripts/build_windows.ps1
            }
          } catch {
            $buildError = $_
          } finally {
            Stop-Transcript | Out-Null
          }
          if ($null -ne $buildError) {
            $tail = (Get-Content build/test-results/windows-build.log -Tail 80) -join "`n"
            $details = ($tail + "`n" + $buildError).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows candidate build::$details"
            throw $buildError
          }
      - name: Check out the real previous application for upgrade testing
        if: steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: c940d732868c11cf15cf264d8cc9a28c5f2045ea
          path: build/previous-source
      - name: Build previous 0.2.0 application and installer
        if: steps.installer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          Push-Location build/previous-source
          try {
            & $python -m PyInstaller --noconfirm --clean --windowed --onedir --name ImageTools --paths . --collect-all psd_tools --collect-all pypdfium2 --collect-all pypdfium2_raw scripts/desktop_entry.py
            if ($LASTEXITCODE -ne 0) { throw 'Previous application build failed' }
          } finally { Pop-Location }
          ./scripts/windows/compile-installer.ps1 -Version '0.2.0' -AppDir (Resolve-Path 'build/previous-source/dist/ImageTools').Path -OutputDir (Join-Path $PWD 'build/previous-installer')
      - name: Save compiled installers before lifecycle testing
        if: steps.installer-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256
            build/previous-installer/*-setup.exe
            build/previous-installer/*-setup.exe.sha256
          # Reuse the key resolved before compilation, never a hash recalculated
          # after build tools have written generated files into the checkout.
          key: ${{ steps.installer-cache.outputs.cache-primary-key }}
      - name: Verify restored installer checksums
        if: steps.installer-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $version = & .venv/Scripts/python.exe -c 'from image_tools import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the candidate version' }
          foreach ($file in @("dist/ImageTools-$version-win-x64-setup.exe", 'build/previous-installer/ImageTools-0.2.0-win-x64-setup.exe')) {
            if (-not (Test-Path -LiteralPath $file) -or -not (Test-Path -LiteralPath ($file + '.sha256'))) {
              throw "Cached installer or its checksum is missing: $file"
            }
            $expected = ((Get-Content -LiteralPath ($file + '.sha256') -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or $actual -ne $expected) {
              throw "Cached installer checksum mismatch: $file"
            }
          }
      - name: Install, upgrade, test the frozen app, uninstall and reinstall
        shell: pwsh
        run: |
          $version = & .venv/Scripts/python.exe -c 'from image_tools import __version__; print(__version__)'
          ./scripts/windows/test-installer.ps1 -PreviousInstaller "build/previous-installer/ImageTools-0.2.0-win-x64-setup.exe" -Installer "dist/ImageTools-$version-win-x64-setup.exe" -ExpectedVersion $version -Python (Resolve-Path '.venv/Scripts/python.exe').Path
      - name: Generate download checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii ($_.FullName + '.sha256')
          }
      - name: Upload tested installation package
        uses: actions/upload-artifact@v4
        with:
          name: ImageTools-windows-x64-installer
          path: |
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-validation-reports
          path: |
            build/test-results/**
            build/installer-tests/**
            !build/installer-tests/installed*/**
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize Windows test failures
        if: always()
        shell: pwsh
        run: |
          $report = 'build/test-results/pytest.xml'
          if (Test-Path $report) {
            [xml]$junit = Get-Content $report -Raw
            '## Windows application regression' >> $env:GITHUB_STEP_SUMMARY
            foreach ($suite in $junit.testsuites.testsuite) {
              "Tests: $($suite.tests); failures: $($suite.failures); errors: $($suite.errors); skipped: $($suite.skipped)" >> $env:GITHUB_STEP_SUMMARY
              Write-Output "::notice title=Windows application tests::Tests: $($suite.tests); failures: $($suite.failures); errors: $($suite.errors); skipped: $($suite.skipped)"
            }
            foreach ($problem in $junit.SelectNodes('//failure | //error')) {
              "### $($problem.ParentNode.name)" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              $problem.InnerText >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
              $details = $problem.InnerText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=$($problem.ParentNode.name)::$details"
            }
          }
          $lifecycle = 'build/installer-tests/installer-regression.json'
          if (Test-Path $lifecycle) {
            '## Windows installer regression' >> $env:GITHUB_STEP_SUMMARY
            '```json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content $lifecycle -Raw >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            $outcome = Get-Content $lifecycle -Raw | ConvertFrom-Json
            Write-Output "::notice title=Completed Windows installer checks::$($outcome.checks -join ', ')"
            if ($outcome.status -ne 'passed') {
              $details = $outcome.error.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows installer lifecycle::$details"
            }
          }
          Get-ChildItem build/installer-tests/*-app.json -ErrorAction SilentlyContinue | ForEach-Object {
            $result = Get-Content $_.FullName -Raw | ConvertFrom-Json
            if ($result.status -ne 'passed') {
              $details = $result.error.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Installed executable regression::$details"
            }
          }

  release:
    name: Publish tested installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'from image_tools import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$version"
      - uses: actions/download-artifact@v4
        with:
          name: ImageTools-windows-x64-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Windows-validation-reports
          path: validation-evidence
      - name: Package Windows validation evidence
        run: |
          cd validation-evidence
          zip -r ../release-assets/Windows-validation-reports.zip .
      - name: Publish downloadable setup file
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "图迹 $RELEASE_TAG · Windows 安装包" --notes-file docs/WINDOWS_RELEASE_NOTES.md

  archive_release:
    name: Archive existing verified installers and logs
    if: github.event_name == 'workflow_dispatch' && inputs.archive_release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish retained installers and logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: python3 scripts/archive_release.py
